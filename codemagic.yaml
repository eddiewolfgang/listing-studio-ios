# Manual simulator tests and signed TestFlight uploads.
workflows:
  ios-testflight:
    name: iPhone TestFlight upload
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - listing_studio_profile
        certificates:
          - listing_studio_appstore
    scripts:
      - name: Prepare release settings
        script: |
          set -euo pipefail
          chmod +x Scripts/release-check.sh
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          project = Path('ListingStudio.xcodeproj/project.pbxproj')
          text = project.read_text()
          text = text.replace('com.example.ListingStudioTests', 'com.eddiewolfgang.listingstudio.tests')
          text = text.replace('com.example.ListingStudio', 'com.eddiewolfgang.listingstudio')
          text = text.replace('"DEVELOPMENT_TEAM" = "";', '"DEVELOPMENT_TEAM" = "D7L36K7WKD";')
          project.write_text(text)
          with open('ListingStudio/Info.plist', 'rb') as f:
              info = plistlib.load(f)
          info['SupportURL'] = 'https://listing-studio-support.eddiewolfgang.chatgpt.site'
          info['PrivacyPolicyURL'] = 'https://listing-studio-support.eddiewolfgang.chatgpt.site/privacy.html'
          with open('ListingStudio/Info.plist', 'wb') as f:
              plistlib.dump(info, f)
          for key in ('PrivacyPolicyURL', 'SupportURL', 'AIServiceURL'):
              if not info.get(key, '').startswith('https://'):
                  raise SystemExit(f'Set a published {key} in ListingStudio/Info.plist before starting this workflow.')
          PY
      - name: Run iPhone simulator tests before upload
        script: |
          set -euo pipefail
          mkdir -p build
          xcrun simctl list devices available --json > build/simulators.json
          LISTING_SIMULATOR_ID=$(python3 - <<'PY'
          import json
          with open('build/simulators.json') as f:
              devices = json.load(f)['devices']
          phones = [d['udid'] for runtime, rows in devices.items()
                    if '.iOS-' in runtime for d in rows
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator found on this build machine.')
          print(phones[0])
          PY
          )
          xcodebuild test \
            -project ListingStudio.xcodeproj \
            -scheme ListingStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$LISTING_SIMULATOR_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ListingStudioTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log
      - name: Apply signing profile
        script: xcode-project use-profiles
      - name: Build signed iPhone archive
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project ListingStudio.xcodeproj \
            --scheme ListingStudio \
            --config Release \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$((BUILD_NUMBER + 1))"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
  ios-simulator-check:
    name: iPhone build and tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Check project files
        script: |
          set -euo pipefail
          test -f ListingStudio.xcodeproj/project.pbxproj
          test -f ListingStudio.xcodeproj/xcshareddata/xcschemes/ListingStudio.xcscheme
          test -f ListingStudio/ListingStudioApp.swift
          chmod +x Scripts/release-check.sh Scripts/verify-on-mac.sh
          xcodebuild -version
      - name: Build and test on an iPhone simulator
        script: |
          set -euo pipefail
          mkdir -p build
          xcrun simctl list devices available --json > build/simulators.json
          LISTING_SIMULATOR_ID=$(python3 - <<'PY'
          import json
          with open('build/simulators.json') as f:
              devices = json.load(f)['devices']
          phones = [d['udid'] for runtime, rows in devices.items()
                    if '.iOS-' in runtime for d in rows
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator found on this build machine.')
          print(phones[0])
          PY
          )
          xcodebuild test \
            -project ListingStudio.xcodeproj \
            -scheme ListingStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$LISTING_SIMULATOR_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ListingStudioTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log
    artifacts:
      - build/xcodebuild.log
      - build/simulators.json
      - build/ListingStudioTests.xcresult
      - build/DerivedData/Build/Products/Debug-iphonesimulator/ListingStudio.app
