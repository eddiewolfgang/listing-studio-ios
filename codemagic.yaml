# Manual simulator validation only. No Apple keys or App Store publishing.
workflows:
  ios-simulator-check:
    name: iPhone build and tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Check project files
        script: |
          set -euo pipefail
          test -f ListingStudio.xcodeproj/project.pbxproj
          test -f ListingStudio.xcodeproj/xcshareddata/xcschemes/ListingStudio.xcscheme
          test -f ListingStudio/ListingStudioApp.swift
          chmod +x Scripts/release-check.sh Scripts/verify-on-mac.sh
          xcodebuild -version
      - name: Build and test on an iPhone simulator
        script: |
          set -euo pipefail
          mkdir -p build
          xcrun simctl list devices available --json > build/simulators.json
          LISTING_SIMULATOR_ID=$(python3 - <<'PY'
          import json
          with open('build/simulators.json') as f:
              devices = json.load(f)['devices']
          phones = [d['udid'] for runtime, rows in devices.items()
                    if '.iOS-' in runtime for d in rows
                    if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator found on this build machine.')
          print(phones[0])
          PY
          )
          xcodebuild test \
            -project ListingStudio.xcodeproj \
            -scheme ListingStudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$LISTING_SIMULATOR_ID" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ListingStudioTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log
    artifacts:
      - build/xcodebuild.log
      - build/simulators.json
      - build/ListingStudioTests.xcresult
      - build/DerivedData/Build/Products/Debug-iphonesimulator/ListingStudio.app
